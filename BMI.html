<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Percabangan</title>
</head>
<body>
    <label>Masukkan Berat Badan (kg): </label>
    <input type="number" id="inputBB">
    <label>Masukkan Tinggi Badan (cm): </label>
    <input type="number" id="inputTB"> 
    <button onclick="calculateBMI()">Cek Hasil</button>
    <p id="outputHasil"></p>

    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('inputBB').value);
            const heightCm = parseFloat(document.getElementById('inputTB').value);

            if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
                alert("Harap masukkan berat dan tinggi badan yang valid.");
                return;
            }

            const heightM = heightCm / 100;
            const bmi = weight / (heightM * heightM);

            let category = "";
            if (bmi < 18.5) {
                category = "Kekurangan berat badan";
            } else if (bmi >= 18.5 && bmi < 25) { 
                category = "Normal (ideal)";
            } else if (bmi >= 25 && bmi < 30) {
                category = "Kelebihan berat badan";
            } else {
                category = "Obesitas";
            }

            const hasilTeks = `Nilai BMI: ${bmi.toFixed(1)} - Kategori: ${category}`;
            document.getElementById('outputHasil').innerText = hasilTeks;
        }
    </script>
</body>
</html>
